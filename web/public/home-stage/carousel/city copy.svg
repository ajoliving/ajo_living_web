        offset="0"
        stop-color="#CDB390"
        stop-opacity="0.38"
      />
      <stop
        offset="1"
        stop-color="#CDB390"
        stop-opacity="0"
      />
    </linearGradient>
    <radialGradient
      id="haze"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(700 188) rotate(90) scale(112 620)"
    >
      <stop
        offset="0"
        stop-color="#FFFDF8"
        stop-opacity="0.95"
      />
      <stop
        offset="1"
        stop-color="#FFFDF8"
        stop-opacity="0"
      />
    </radialGradient>
    <filter
      id="soft-blur"
      x="-50"
      y="-50"
      width="1500"
      height="550"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
