<svg
  width="1400"
  height="450"
  viewBox="0 0 1400 450"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!--
    * Hong Kong skyline banner.
    * 1. Strengthen IFC, Bank of China Tower, and Central Harbourfront recognition.
    * 2. Use warm neutral gradients and soft haze for a refined premium look.
    * 3. Add subtle 3D massing through front and side faces instead of flat outlines only.
  -->
  <defs>
    <linearGradient
      id="sky"
      x1="700"
      y1="28"
      x2="700"
      y2="450"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#FFFEFB"
      />
      <stop
        offset="0.55"
        stop-color="#FAF6EF"
      />
      <stop
        offset="1"
        stop-color="#F2E9DC"
      />
    </linearGradient>
    <linearGradient
      id="water"
      x1="700"
      y1="308"
      x2="700"
      y2="450"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#F8F1E5"
        stop-opacity="0.9"
      />
      <stop
        offset="1"
        stop-color="#E9DCC8"
        stop-opacity="0.42"
      />
    </linearGradient>
    <linearGradient
      id="mountain-fill"
      x1="700"
      y1="104"
      x2="700"
      y2="268"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#FBF7F0"
        stop-opacity="0.9"
      />
      <stop
        offset="1"
        stop-color="#F2E8D9"
        stop-opacity="0.46"
      />
    </linearGradient>
    <linearGradient
      id="front-face"
      x1="700"
      y1="120"
      x2="700"
      y2="330"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#FFFDF8"
        stop-opacity="0.96"
      />
      <stop
        offset="1"
        stop-color="#F6EDDF"
        stop-opacity="0.82"
      />
    </linearGradient>
    <linearGradient
      id="side-face"
      x1="700"
      y1="120"
      x2="700"
      y2="330"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#F1E4D0"
        stop-opacity="0.85"
      />
      <stop
        offset="1"
        stop-color="#E4D1B7"
        stop-opacity="0.72"
      />
    </linearGradient>
    <linearGradient
      id="reflection"
      x1="700"
      y1="318"
      x2="700"
      y2="430"
      gradientUnits="userSpaceOnUse"
    >
